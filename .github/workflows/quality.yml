name: Engineering quality

on:
  push:
    branches: [main, codex/nigerlan-modernization]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        command: [check:repo, format:check, lint, test, build, security:api, security:dependencies]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify runtime and install
        run: |
          node --version
          test "$(npm --version)" = "11.19.0"
          npm ci --no-fund --no-audit
      - run: npm run ${{ matrix.command }}
        env:
          CI: 'true'
      - name: Verify Vercel output directory
        if: matrix.command == 'build'
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { outputDirectory } = require('./vercel.json');
          for (const file of ['index.html', 'asset-manifest.json']) {
            const artifact = path.join(outputDirectory, file);
            assert.ok(fs.statSync(artifact).size > 0, `Empty deployment artifact: ${artifact}`);
          }
          console.log(`Vercel output verified: ${outputDirectory}`);
          NODE

  secrets:
    name: Current files and Git history secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: npm run security:install
      - run: npm run security:secrets
